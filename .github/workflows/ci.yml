name: Java CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Compile and test (Java 11)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
      - name: Compile and run tests
        run: ./mvnw --batch-mode --no-transfer-progress clean test

  database:
    name: PostgreSQL schema and persistence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COMPOSE_PROJECT_NAME: movie-ci-${{ github.run_id }}-${{ github.run_attempt }}
      POSTGRES_PASSWORD: ci-only-disposable-password
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Validate and start database
        run: |
          docker compose config --quiet
          docker compose up -d --wait --wait-timeout 120 db
      - name: Apply Flyway migrations with psql
        # The same files Flyway runs inside the application. Sorted by version so
        # V2 never lands before V1; switch to numeric-aware sorting past V9.
        run: |
          for file in $(ls backend/src/main/resources/db/migration/V*.sql | sort -V); do
            echo "Applying $file"
            docker compose exec -T db psql -U movie_app -d movie_manager -v ON_ERROR_STOP=1 -q < "$file"
          done
      - name: Check schema and constraints
        run: docker compose exec -T db psql -U movie_app -d movie_manager -v ON_ERROR_STOP=1 < database/checks.sql
      - name: Verify data survives container replacement
        run: |
          docker compose exec -T db psql -U movie_app -d movie_manager -v ON_ERROR_STOP=1 -c "INSERT INTO movies (title) VALUES ('CI persistence marker');"
          docker compose down
          docker compose up -d --wait --wait-timeout 120 db
          count=$(docker compose exec -T db psql -U movie_app -d movie_manager -Atc "SELECT count(*) FROM movies WHERE title = 'CI persistence marker';")
          test "$count" = "1"
      - name: Database diagnostics
        if: failure()
        run: docker compose logs db
      - name: Remove disposable CI database
        if: always()
        run: docker compose down --volumes

  backend:
    name: Spring Boot API with PostgreSQL (Java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: movie-api-ci-${{ github.run_id }}-${{ github.run_attempt }}
      POSTGRES_PASSWORD: ci-only-disposable-password
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Start disposable PostgreSQL
        run: docker compose up -d --wait --wait-timeout 120 db
      - name: Build backend and verify HTTP/database integration
        run: ./mvnw -f backend/pom.xml --batch-mode --no-transfer-progress -Pintegration verify
      - name: Integration diagnostics
        if: failure()
        run: |
          docker compose logs db
          if [ -d backend/target/failsafe-reports ]; then
            cat backend/target/failsafe-reports/*.txt
          fi
      - name: Remove disposable CI database
        if: always()
        run: docker compose down --volumes

  frontend:
    name: Frontend typecheck and build (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install exactly the locked dependencies
        run: npm ci
      - name: Typecheck and build
        run: npm run build

  image:
    name: Container image and end-to-end smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: movie-image-${{ github.run_id }}-${{ github.run_attempt }}
      POSTGRES_PASSWORD: ci-only-disposable-password
      # Prove that a closed deployment really does refuse writes.
      RATINGS_WRITABLE: "false"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Build the image
        run: docker compose build app
      - name: Start database and application
        run: |
          docker compose up -d --wait --wait-timeout 120 db
          docker compose up -d app
      - name: Wait for the application to answer
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/actuator/health >/dev/null 2>&1; then
              echo "up after ${attempt}s"; exit 0
            fi
            sleep 1
          done
          echo "application never became healthy"; exit 1
      - name: The browser bundle and the API are served from one origin
        run: |
          curl -fsS http://127.0.0.1:8080/actuator/health | grep -q '"status":"UP"'
          curl -fsS http://127.0.0.1:8080/ | grep -q 'id="root"'
          curl -fsS http://127.0.0.1:8080/api/movies | grep -q 'The Godfather'
          curl -fsS http://127.0.0.1:8080/api/genres | grep -q 'Drama'
          curl -fsS http://127.0.0.1:8080/api/config | grep -q '"ratingsWritable":false'
      - name: A read-only deployment refuses writes
        run: |
          id=$(curl -fsS "http://127.0.0.1:8080/api/movies?size=1" | sed -n 's/.*"id":\([0-9]*\).*/\1/p' | head -1)
          code=$(curl -s -o /dev/null -w '%{http_code}' -X PUT \
            -H 'Content-Type: application/json' -d '{"score":5}' \
            "http://127.0.0.1:8080/api/movies/$id/ratings/1")
          echo "PUT returned $code"
          test "$code" = "403"
      - name: Diagnostics
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Remove the disposable stack
        if: always()
        run: docker compose down --volumes
