services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: movie_manager
      POSTGRES_USER: movie_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - movie_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movie_app -d movie_manager"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  movie_data:
