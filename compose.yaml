services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: movie_manager
      POSTGRES_USER: movie_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - movie_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movie_app -d movie_manager"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SERVER_ADDRESS: 0.0.0.0
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: movie_manager
      POSTGRES_USER: movie_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      # Local runs allow writes; deployments set this to false until sign-in exists.
      RATINGS_WRITABLE: ${RATINGS_WRITABLE:-true}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"

volumes:
  movie_data:
