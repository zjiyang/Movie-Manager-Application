spring.application.name=movie-manager

# Bind to loopback while developing so nothing on the network can reach a local
# run. A container overrides this with 0.0.0.0, which is the only address that
# works once the process is behind a published port.
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8080}

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:127.0.0.1}:${POSTGRES_PORT:5432}/${POSTGRES_DB:movie_manager}
spring.datasource.username=${POSTGRES_USER:movie_app}
spring.datasource.password=${POSTGRES_PASSWORD}

# Flyway owns the schema: it applies db/migration/V*.sql on startup.
# Hibernate only checks that the mapping matches what Flyway built, and is
# never allowed to create or alter a table itself.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.mvc.problemdetails.enabled=true

# Anyone who can reach the rating endpoints can write as any user, because the
# user is still a path segment. Deployments set this to false until sign-in
# exists; local development leaves it on.
app.ratings.writable=${RATINGS_WRITABLE:true}

# Health only. Nothing else is exposed: the other endpoints report configuration
# and internals that a public deployment should not hand out.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
